<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#101510">
<title>OUTLAW: City Frontier</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:16px 14px 90px;background:#101510;color:#edf2e9;font:16px system-ui,-apple-system,sans-serif}header{padding:14px 0;border-bottom:1px solid #354538}header b{font-size:21px;letter-spacing:1px}header span{color:#a8d36a}small,.muted{color:#a5b3a1}.panel{background:#1a231c;border:1px solid #354538;border-radius:15px;padding:15px;margin-top:14px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#101510;border:1px solid #354538;border-radius:10px;padding:10px;min-width:0}.stat strong{font-size:20px}.bar{height:5px;background:#354538;border-radius:8px;margin-top:5px;overflow:hidden}.bar i{display:block;height:100%;background:#a8d36a}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.grid button,button{background:#29392b;color:#edf2e9;border:1px solid #405443;border-radius:11px;padding:12px;font:inherit;cursor:pointer}.grid button{text-align:left;min-height:84px}.grid b,.grid small{display:block}.grid small{font-size:12px;margin-top:4px}.gold{color:#e6bd65}.log{font-size:13px;padding:8px 0;border-bottom:1px solid #354538}.nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;background:#111711;border-top:1px solid #354538;padding:10px 2px calc(10px + env(safe-area-inset-bottom))}.nav button{background:transparent;border:0;font-size:12px;padding:8px 5px}.nav button.active{color:#a8d36a}h2{font-size:16px;margin:0 0 12px}.note{font-size:12px;line-height:1.5;color:#a5b3a1}
</style>
</head>
<body>
<header><b>OUTLAW<span>:</span> CITY FRONTIER</b><div class="muted">SURVIVE THE STREETS. BUILD YOUR LEGACY.</div></header>
<main id="app"></main>
<nav class="nav"><button data-tab="home">⌂ Home</button><button data-tab="crimes">⚑ Crimes</button><button data-tab="survival">⌁ Survival</button><button data-tab="training">✦ Training</button><button data-tab="profile">☻ Profile</button></nav>
<script>
const KEY='outlaw-frontier-save';
const fresh=()=>({name:'Rookie',level:1,xp:0,cash:250,hp:100,energy:100,food:80,water:80,wood:0,scrap:0,medkits:1,stats:{Strength:5,Defense:5,Speed:5,Dexterity:5},log:['Welcome to City Frontier. Your rise starts today.'],jobs:0,trained:0,daily:''});
let S;try{S=JSON.parse(localStorage.getItem(KEY))||fresh()}catch(e){S=fresh()}
let tab='home';
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function note(t){S.log.unshift(t);S.log=S.log.slice(0,15)}
function level(n){S.xp+=n;while(S.xp>=S.level*100){S.xp-=S.level*100;S.level++;S.hp=Math.min(100,S.hp+20);S.energy=100;note('LEVEL UP! You reached level '+S.level+'!')}}
function spend(n){if(S.energy<n){alert('Not enough energy. Rest in Survival.');return false}S.energy-=n;S.food=Math.max(0,S.food-2);S.water=Math.max(0,S.water-3);if(!S.food||!S.water)S.hp=Math.max(1,S.hp-3);return true}
function act(a){if(a==='crime'){if(!spend(15))return;S.jobs++;if(Math.random()<Math.min(.95,.75+S.stats.Dexterity*.01)){let n=20+Math.floor(Math.random()*31);S.cash+=n;level(20);note('Street job succeeded: +$'+n+' and +20 XP.')}else{S.hp=Math.max(1,S.hp-10);note('Job failed. You lost 10 health.')}}else if(a==='scavenge'){if(!spend(10))return;let w=1+Math.floor(Math.random()*3),r=Math.floor(Math.random()*3);S.wood+=w;S.scrap+=r;level(12);note('Scavenged '+w+' wood and '+r+' scrap.')}else if(a==='provisions'){if(!spend(8))return;let f=10+Math.floor(Math.random()*16),w=10+Math.floor(Math.random()*16);S.food=Math.min(100,S.food+f);S.water=Math.min(100,S.water+w);level(8);note('Found '+f+' food and '+w+' water.')}else if(a==='rest'){S.energy=Math.min(100,S.energy+35);S.hp=Math.min(100,S.hp+8);note('Rested and recovered.')}else if(a==='medkit'){if(!S.medkits||S.hp===100){alert('No medkit needed or available.');return}S.medkits--;S.hp=Math.min(100,S.hp+35);note('Used a medkit. +35 health.')}else if(a.startsWith('train:')){let k=a.split(':')[1];if(S.cash<50){alert('You need $50.');return}S.cash-=50;S.stats[k]++;S.trained++;level(5);note(k+' increased to '+S.stats[k]+'.')}else if(a==='daily'){let d=new Date().toDateString();if(S.daily===d){alert('Daily bonus already claimed.');return}S.daily=d;S.cash+=100;S.energy=Math.min(100,S.energy+20);note('Daily bonus: +$100 and +20 energy.')}else if(a==='rename'){let n=prompt('Choose your outlaw alias',S.name);if(n&&n.trim())S.name=n.trim().slice(0,18)}else if(a==='reset'){if(confirm('Reset all progress?'))S=fresh()}else if(a==='export'){let b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='outlaw-save.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}save();render()}
function btn(emoji,title,desc,action){return '<button data-act="'+action+'"><b>'+emoji+' '+title+'</b><small>'+desc+'</small></button>'}
function hero(){return '<section class="panel"><small>DISTRICT 01 · THE OUTSKIRTS</small><h1>Make a name.<br>Survive the city.</h1><div class="stats"><div class="stat"><small>Cash</small><strong class="gold">$'+S.cash+'</strong></div><div class="stat"><small>Level</small><strong>'+S.level+'</strong><div class="bar"><i style="width:'+Math.min(100,S.xp/(S.level*100)*100)+'%"></i></div><small>'+S.xp+'/'+S.level*100+' XP</small></div><div class="stat"><small>Health</small><strong>'+S.hp+'/100</strong><div class="bar"><i style="width:'+S.hp+'%"></i></div></div></div></section>'}
function logs(){return '<section class="panel"><h2>Recent activity</h2>'+S.log.map(x=>'<div class="log">'+safe(x)+'</div>').join('')+'</section>'}
function safe(x){return String(x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function render(){let body='';if(tab==='home')body=hero()+'<section class="panel"><h2>Quick actions</h2><div class="grid">'+btn('⚑','Street job','Earn cash and XP','crime')+btn('🪵','Scavenge','Find wood and scrap','scavenge')+btn('🥫','Provisions','Find food and water','provisions')+btn('✦','Train strength','Spend $50 for +1 strength','train:Strength')+'</div></section><section class="panel"><h2>Survival status</h2><p>Energy: '+S.energy+'/100</p><p>Food: '+S.food+'/100</p><p>Water: '+S.water+'/100</p></section>'+logs();if(tab==='crimes')body=hero()+'<section class="panel"><h2>Street jobs</h2><div class="grid">'+btn('🛵','Courier hustle','Low risk · energy −15','crime')+btn('📦','Warehouse swipe','Earn XP through jobs','crime')+'</div><p class="note">Risk and rewards will expand in future versions.</p></section>'+logs();if(tab==='survival')body=hero()+'<section class="panel"><h2>Outskirts survival</h2><div class="grid">'+btn('🪵','Scavenge','Wood: '+S.wood+' · Scrap: '+S.scrap,'scavenge')+btn('🥫','Find provisions','Food and water','provisions')+btn('🩹','Use medkit','Medkits: '+S.medkits,'medkit')+btn('🌙','Rest','Restore energy and health','rest')+'</div></section>'+logs();if(tab==='training')body=hero()+'<section class="panel"><h2>Train your stats · $50 each</h2>'+Object.keys(S.stats).map(k=>'<div class="log"><b>'+k+': '+S.stats[k]+'</b> <button data-act="train:'+k+'">Train +1</button></div>').join('')+'</section>'+logs();if(tab==='profile')body=hero()+'<section class="panel"><h2>Outlaw profile</h2><p>Alias: <b>'+safe(S.name)+'</b> <button data-act="rename">Change</button></p><p>Jobs attempted: '+S.jobs+'</p><p>Training sessions: '+S.trained+'</p><p>Inventory: Pocket Knife ×1</p><button data-act="daily">Claim daily bonus</button> <button data-act="export">Export save</button> <button data-act="reset">Reset game</button><p class="note">Progress is stored in this browser on this device. Export a backup before clearing browser data.</p></section>'+logs();document.getElementById('app').innerHTML=body;document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab))}
document.addEventListener('click',e=>{let t=e.target.closest('[data-tab]');if(t){tab=t.dataset.tab;render();return}let b=e.target.closest('[data-act]');if(b)act(b.dataset.act)});save();render();
</script>
</body>
</html>
